<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Web Creator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header & Switcher UI */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #11111b;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: #89b4fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: #f38ba8;
        }

        .view-switcher {
            display: flex;
            background-color: #313244;
            border-radius: 30px;
            padding: 4px;
        }

        .view-switcher button {
            background: transparent;
            border: none;
            color: #a6adc8;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-switcher button.active {
            background-color: #89b4fa;
            color: #11111b;
            box-shadow: 0 2px 10px rgba(137, 180, 250, 0.4);
        }

        /* Main Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #editor-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }

        /* Tab Header Section (Contains Tabs + Action Buttons) */
        .tab-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #181825;
            padding: 0 10px;
        }

        .code-tabs {
            display: flex;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #6c7086;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #cdd6f4;
            border-bottom-color: #f38ba8;
        }

        .tab-btn:hover {
            color: #bac2de;
        }

        /* Action Buttons (Clear & Download) */
        .action-btns {
            display: flex;
            gap: 15px;
            padding-right: 10px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #a6adc8;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .icon-btn:hover#btn-clear {
            color: #f38ba8; /* Red for clear */
            transform: scale(1.1);
        }

        .icon-btn:hover#btn-download {
            color: #a6e3a1; /* Green for download */
            transform: scale(1.1);
        }

        /* Textareas */
        .code-area {
            flex: 1;
            width: 100%;
            background-color: #1e1e2e;
            color: #a6e3a1;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 15px;
            border: none;
            outline: none;
            resize: none;
            display: none;
        }

        .code-area.active {
            display: block;
        }

        /* Preview Section */
        #preview-container {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #preview-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        main.show-preview #editor-container {
            opacity: 0;
            pointer-events: none;
        }

        main.show-preview #preview-container {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Web<span>Creator</span></div>
        <div class="view-switcher">
            <button id="btn-code" class="active">Code</button>
            <button id="btn-preview">Live Preview</button>
        </div>
    </header>

    <main id="main-area">
        <!-- Code Editor View -->
        <div id="editor-container">
            
            <div class="tab-header">
                <!-- Code Tabs -->
                <div class="code-tabs">
                    <button class="tab-btn active" data-target="html-code">HTML</button>
                    <button class="tab-btn" data-target="css-code">CSS</button>
                    <button class="tab-btn" data-target="js-code">JS</button>
                </div>
                
                <!-- Action Buttons (Download & Clear) -->
                <div class="action-btns">
                    <button id="btn-clear" class="icon-btn" title="Clear Code">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                    <button id="btn-download" class="icon-btn" title="Download Code">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </button>
                </div>
            </div>
            
            <textarea id="html-code" class="code-area active" placeholder="<!-- මෙතන HTML කේතය ලියන්න -->" spellcheck="false"></textarea>
            <textarea id="css-code" class="code-area" placeholder="/* මෙතන CSS කේතය ලියන්න */" spellcheck="false" style="color:#89dceb;"></textarea>
            <textarea id="js-code" class="code-area" placeholder="// මෙතන JavaScript කේතය ලියන්න" spellcheck="false" style="color:#f9e2af;"></textarea>
        </div>

        <!-- Live Preview View -->
        <div id="preview-container">
            <iframe id="live-output"></iframe>
        </div>
    </main>

    <script>
        // DOM Elements
        const htmlCode = document.getElementById('html-code');
        const cssCode = document.getElementById('css-code');
        const jsCode = document.getElementById('js-code');
        const liveOutput = document.getElementById('live-output');
        
        const btnCode = document.getElementById('btn-code');
        const btnPreview = document.getElementById('btn-preview');
        const mainArea = document.getElementById('main-area');
        
        const tabBtns = document.querySelectorAll('.tab-btn');
        const codeAreas = document.querySelectorAll('.code-area');

        const btnClear = document.getElementById('btn-clear');
        const btnDownload = document.getElementById('btn-download');

        // Live Update Function
        function updatePreview() {
            const html = htmlCode.value;
            const css = `<style>${cssCode.value}</style>`;
            const js = `<script>${jsCode.value}<\/script>`;
            
            const iframeDoc = liveOutput.contentDocument || liveOutput.contentWindow.document;
            
            iframeDoc.open();
            iframeDoc.write(html + css + js);
            iframeDoc.close();
        }

        // Add event listeners to textareas
        [htmlCode, cssCode, jsCode].forEach(textarea => {
            textarea.addEventListener('input', updatePreview);
        });

        // Switch between Code and Preview
        btnCode.addEventListener('click', () => {
            btnCode.classList.add('active');
            btnPreview.classList.remove('active');
            mainArea.classList.remove('show-preview');
        });

        btnPreview.addEventListener('click', () => {
            btnPreview.classList.add('active');
            btnCode.classList.remove('active');
            mainArea.classList.add('show-preview');
            updatePreview(); 
        });

        // Switch between HTML, CSS, JS tabs
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(t => t.classList.remove('active'));
                codeAreas.forEach(c => c.classList.remove('active'));
                
                btn.classList.add('active');
                document.getElementById(btn.dataset.target).classList.add('active');
            });
        });

        // Get Currently Active Textarea
        function getActiveTextarea() {
            return document.querySelector('.code-area.active');
        }

        // Clear Button Logic
        btnClear.addEventListener('click', () => {
            const activeArea = getActiveTextarea();
            if (activeArea) {
                // Confirm before clearing to prevent accidental data loss
                if(confirm("ඔබට මෙම කේතය මකා දැමීමට අවශ්‍ය බව විශ්වාසද?")) {
                    activeArea.value = '';
                    updatePreview();
                }
            }
        });

        // Download Button Logic
        btnDownload.addEventListener('click', () => {
            const activeArea = getActiveTextarea();
            if (!activeArea) return;

            let content = activeArea.value;
            let fileName = '';
            let mimeType = 'text/plain';

            // Determine file extension based on active tab
            if (activeArea.id === 'html-code') {
                fileName = 'index.html';
                mimeType = 'text/html';
            } else if (activeArea.id === 'css-code') {
                fileName = 'style.css';
                mimeType = 'text/css';
            } else if (activeArea.id === 'js-code') {
                fileName = 'script.js';
                mimeType = 'text/javascript';
            }

            // Create Blob and trigger download
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Default Code
        htmlCode.value = `
<div class="card">
  <h1>ආයුබෝවන්! 🇱🇰</h1>
  <p>ඔබගේ Live Code Editor එක වැඩ කිරීම ආරම්භ කර ඇත.</p>
  <button onclick="sayHello()">Click Me</button>
</div>`;

        cssCode.value = `
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f0f2f5;
  font-family: Arial, sans-serif;
  margin: 0;
}
.card {
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  text-align: center;
}
h1 { color: #f38ba8; }
button {
  background: #89b4fa;
  color: white;
  border: none;
  padding: 10px 20px;
  font-size: 16px;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 15px;
}
button:hover { background: #74a1f0; }`;

        jsCode.value = `
function sayHello() {
  alert('සාර්ථකයි! ඔයාගෙ JavaScript එකත් වැඩ කරනවා 🎉');
}`;

        // Initialize
        updatePreview();
    </script>
</body>
</html>
