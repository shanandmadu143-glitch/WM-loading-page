<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <!-- Mobile සහ Tablet සඳහා හොඳින්ම පෙනීමට -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Web Creator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header & Switcher UI */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #11111b;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: #89b4fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: #f38ba8;
        }

        /* View Switcher (Code / Preview) */
        .view-switcher {
            display: flex;
            background-color: #313244;
            border-radius: 30px;
            padding: 4px;
        }

        .view-switcher button {
            background: transparent;
            border: none;
            color: #a6adc8;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-switcher button.active {
            background-color: #89b4fa;
            color: #11111b;
            box-shadow: 0 2px 10px rgba(137, 180, 250, 0.4);
        }

        /* Main Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Editor Section */
        #editor-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }

        /* Code Tabs (HTML, CSS, JS) */
        .code-tabs {
            display: flex;
            background-color: #181825;
            padding: 0 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: #6c7086;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #cdd6f4;
            border-bottom-color: #f38ba8;
        }

        .tab-btn:hover {
            color: #bac2de;
        }

        /* Textareas */
        .code-area {
            flex: 1;
            width: 100%;
            background-color: #1e1e2e;
            color: #a6e3a1;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px; /* 16px prevents auto-zoom on mobile */
            padding: 15px;
            border: none;
            outline: none;
            resize: none;
            display: none;
        }

        .code-area.active {
            display: block;
        }

        /* Preview Section */
        #preview-container {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #preview-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* View Toggle Logic */
        main.show-preview #editor-container {
            opacity: 0;
            pointer-events: none;
        }

        main.show-preview #preview-container {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Web<span>Creator</span></div>
        <div class="view-switcher">
            <button id="btn-code" class="active">Code</button>
            <button id="btn-preview">Live Preview</button>
        </div>
    </header>

    <main id="main-area">
        <!-- Code Editor View -->
        <div id="editor-container">
            <div class="code-tabs">
                <button class="tab-btn active" data-target="html-code">HTML</button>
                <button class="tab-btn" data-target="css-code">CSS</button>
                <button class="tab-btn" data-target="js-code">JS</button>
            </div>
            
            <textarea id="html-code" class="code-area active" placeholder="<!-- මෙතන HTML කේතය ලියන්න -->" spellcheck="false"></textarea>
            <textarea id="css-code" class="code-area" placeholder="/* මෙතන CSS කේතය ලියන්න */" spellcheck="false" style="color:#89dceb;"></textarea>
            <textarea id="js-code" class="code-area" placeholder="// මෙතන JavaScript කේතය ලියන්න" spellcheck="false" style="color:#f9e2af;"></textarea>
        </div>

        <!-- Live Preview View -->
        <div id="preview-container">
            <iframe id="live-output"></iframe>
        </div>
    </main>

    <script>
        // DOM Elements
        const htmlCode = document.getElementById('html-code');
        const cssCode = document.getElementById('css-code');
        const jsCode = document.getElementById('js-code');
        const liveOutput = document.getElementById('live-output');
        
        const btnCode = document.getElementById('btn-code');
        const btnPreview = document.getElementById('btn-preview');
        const mainArea = document.getElementById('main-area');
        
        const tabBtns = document.querySelectorAll('.tab-btn');
        const codeAreas = document.querySelectorAll('.code-area');

        // Live Update Function
        function updatePreview() {
            const html = htmlCode.value;
            const css = `<style>${cssCode.value}</style>`;
            const js = `<script>${jsCode.value}<\/script>`;
            
            const iframeDoc = liveOutput.contentDocument || liveOutput.contentWindow.document;
            
            iframeDoc.open();
            iframeDoc.write(html + css + js);
            iframeDoc.close();
        }

        // Add event listeners to textareas to update live
        [htmlCode, cssCode, jsCode].forEach(textarea => {
            textarea.addEventListener('input', updatePreview);
        });

        // Switch between Code and Preview
        btnCode.addEventListener('click', () => {
            btnCode.classList.add('active');
            btnPreview.classList.remove('active');
            mainArea.classList.remove('show-preview');
        });

        btnPreview.addEventListener('click', () => {
            btnPreview.classList.add('active');
            btnCode.classList.remove('active');
            mainArea.classList.add('show-preview');
            updatePreview(); // Ensure it updates when switching
        });

        // Switch between HTML, CSS, JS tabs
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active classes
                tabBtns.forEach(t => t.classList.remove('active'));
                codeAreas.forEach(c => c.classList.remove('active'));
                
                // Add active class to clicked tab and corresponding textarea
                btn.classList.add('active');
                document.getElementById(btn.dataset.target).classList.add('active');
            });
        });

        // Default Code to start with
        htmlCode.value = `
<div class="card">
  <h1>ආයුබෝවන්! 🇱🇰</h1>
  <p>ඔබගේ Live Code Editor එක වැඩ කිරීම ආරම්භ කර ඇත.</p>
  <button onclick="sayHello()">Click Me</button>
</div>`;

        cssCode.value = `
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f0f2f5;
  font-family: Arial, sans-serif;
  margin: 0;
}
.card {
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  text-align: center;
}
h1 { color: #f38ba8; }
button {
  background: #89b4fa;
  color: white;
  border: none;
  padding: 10px 20px;
  font-size: 16px;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 15px;
}
button:hover { background: #74a1f0; }`;

        jsCode.value = `
function sayHello() {
  alert('සාර්ථකයි! ඔයාගෙ JavaScript එකත් වැඩ කරනවා 🎉');
}`;

        // Initialize preview on load
        updatePreview();
    </script>
</body>
</html>
