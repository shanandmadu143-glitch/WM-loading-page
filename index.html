<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Code Editor</title>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="logo">
            <i class="fa-solid fa-code"></i> <span>Pro Editor</span>
        </div>
        <div class="actions">
            <!-- File Select Icon -->
            <button id="openFileBtn" class="action-btn" title="Open File">
                <i class="fa-regular fa-folder-open"></i>
            </button>
            <input type="file" id="fileInput" accept=".txt,.html,.css,.js,.json" style="display: none;">
            
            <!-- Copy / Paste Icons -->
            <button id="copyBtn" class="action-btn" title="Copy Text">
                <i class="fa-regular fa-copy"></i>
            </button>
            <button id="pasteBtn" class="action-btn" title="Paste Text">
                <i class="fa-regular fa-clipboard"></i>
            </button>
        </div>
    </header>

    <main class="editor-container">
        <textarea id="editor" placeholder="ඔබගේ කේත හෝ සටහන් මෙහි ඇතුලත් කරන්න..."></textarea>
    </main>

    <!-- Network Status Notification -->
    <div id="networkStatus" class="toast hidden"></div>

    <script src="script.js"></script>
</body>
</html>
